<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الزيارة الافتراضية 360° — Assadaka Alraqia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
html,body{margin:0;height:100%;background:#0a0a0a;font-family:system-ui,Arial,sans-serif}
html[lang="ar"],html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,Arial,sans-serif}
#topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.78),transparent);color:#fff;pointer-events:none}
#topbar strong{font-size:15px;line-height:1.35;max-width:46vw}
#v-controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;pointer-events:auto}
button{background:#fff;border:0;border-radius:10px;padding:8px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;direction:inherit}
button.primary{background:#c9a86a;color:#000}
button.sound{border:1px solid rgba(201,168,106,.85);background:rgba(8,9,11,.72);color:#e3cfa2}
button.sound.is-on{background:#c9a86a;color:#000}
button.lang{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
#panorama{width:100%;height:72vh;min-height:440px}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:12px;max-width:92%;text-align:center;font-size:14px;line-height:1.5;z-index:10}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;z-index:10;display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid rgba(201,168,106,.45);background:rgba(8,9,11,.8);color:#e3cfa2;font-size:11px;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#status .dot{width:7px;height:7px;border-radius:50%;background:#c9a86a;flex:none}
#status.is-on .dot{animation:v-pulse 1.1s ease-in-out infinite}
@keyframes v-pulse{0%,100%{opacity:1}50%{opacity:.25}}
#thumbs{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;max-width:96%;overflow-x:auto;padding:4px}
#thumbs img{width:96px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;border:2px solid transparent}
#thumbs img.active{opacity:1;border-color:#fff}
#arrows{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;direction:ltr;pointer-events:none;z-index:10}
#arrows span{pointer-events:auto;background:rgba(255,255,255,.9);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;margin:0 12px}
@media (max-width:640px){#topbar strong{font-size:13px;max-width:100%}#caption{bottom:88px;font-size:12.5px;padding:8px 13px}#status{bottom:50px;font-size:10px}button{padding:7px 9px;font-size:11px}#arrows span{width:38px;height:38px}}
</style>
</head>
<body>
<div id="topbar">
<strong id="v-title">جولة 360°</strong>
<div id="v-controls">
<button class="primary" id="btn-guided" onclick="startGuided(true)">▶ الجولة المرشدة</button>
<button id="btn-pause" onclick="stopGuided()">⏸</button>
<button id="btn-fs" onclick="viewer.toggleFullscreen()">⛶</button>
<button class="sound" id="btn-sound" aria-pressed="false" onclick="setNarration(!window.__narrationOn)">🔊 تشغيل التعليق</button>
<button class="lang" id="btn-lang" onclick="requestLang(document.documentElement.lang === 'ar' ? 'en' : 'ar')">English</button>
</div>
</div>
<div id="panorama"></div>
<div id="caption">جارٍ تحميل المشهد…</div>
<div id="status"><span class="dot"></span><span id="status-text">التعليق الصوتي بالعربية والإنجليزية</span></div>
<div id="arrows"><span id="arrow-l">‹</span><span id="arrow-r">›</span></div>
<div id="thumbs"></div>
<audio id="narration" preload="metadata"></audio>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
/* Viewer Pannellum bilingue arabe / anglais + commentaire audio.
   Les 8 fichiers pano*.jpg ne sont ni modifiés ni recompressés. */
(function () {
  'use strict';

  var I18N = {
    ar: {
      pageTitle: 'الزيارة الافتراضية 360° — Assadaka Alraqia',
      bar: 'جولة 360° في معرض الصداقة الراقية',
      guided: '▶ الجولة المرشدة',
      pause: 'إيقاف الجولة',
      fs: 'ملء الشاشة',
      soundOn: '🔊 تشغيل التعليق',
      soundOff: '🔇 إيقاف التعليق',
      switchLang: 'English',
      loading: 'جارٍ تحميل المشهد…',
      next: 'التالي',
      prev: 'السابق',
      playing: 'التعليق الصوتي قيد التشغيل',
      audioHint: 'التعليق الصوتي بالعربية والإنجليزية',
      browserVoice: 'التعليق الصوتي عبر صوت المتصفح',
      blocked: 'اضغط على زر التعليق الصوتي لتشغيل الصوت',
      unsupported: 'التعليق الصوتي غير متاح في هذا المتصفح',
      viewerMissing: 'تعذّر تحميل مكتبة العرض 360° — بقية الصفحة تعمل بشكل طبيعي'
    },
    en: {
      pageTitle: 'Virtual 360° tour — Assadaka Alraqia',
      bar: '360° Assadaka Alraqia showroom tour',
      guided: '▶ Guided tour',
      pause: 'Pause tour',
      fs: 'Fullscreen',
      soundOn: '🔊 Voice narration',
      soundOff: '🔇 Mute narration',
      switchLang: 'العربية',
      loading: 'Loading the panorama…',
      next: 'Next',
      prev: 'Previous',
      playing: 'Audio commentary playing',
      audioHint: 'Audio commentary in Arabic and English',
      browserVoice: 'Commentary using your browser voice',
      blocked: 'Tap the voice narration button to enable sound',
      unsupported: 'Audio commentary is not available in this browser',
      viewerMissing: 'The 360° library could not load — the rest of the page still works'
    }
  };

  /* L'ordre est celui des fichiers pano1.jpg → pano8.jpg. */
  var ORDER = [
    {id:'s1',file:'pano1.jpg',title:{ar:'المدخل ومنصّة المغاسل',en:'Entrance & basin display'},text:{ar:'مغاسل فوقية ومرايا على منصّات مضاءة.',en:'Vessel basins and mirrors on lit plinths.'}},
    {id:'s2',file:'pano2.jpg',title:{ar:'ركن الرخام والمغاسل',en:'Marble & basin corner'},text:{ar:'رخام داكن، مغاسل معلّقة ومقصورة زجاجية.',en:'Dark marble, wall-hung basins and a glass enclosure.'}},
    {id:'s3',file:'pano3.jpg',title:{ar:'الخلاطات والإكسسوارات',en:'Taps & accessories'},text:{ar:'منصّات عرض بموديلات ومقاسات متعددة.',en:'Display stands with several models and sizes.'}},
    {id:'s4',file:'pano4.jpg',title:{ar:'الواجهة الزجاجية',en:'The window front'},text:{ar:'إطلالة على الشارع وإضاءة طبيعية.',en:'Street view and natural light.'}},
    {id:'s5',file:'pano5.jpg',title:{ar:'ركن CeraStyle',en:'The CeraStyle corner'},text:{ar:'واجهة العلامة ورفوف الموديلات.',en:'The brand display and model shelving.'}},
    {id:'s6',file:'pano6.jpg',title:{ar:'الاستقبال ونهاية الجولة',en:'Reception & end of tour'},text:{ar:'مكتب استقبال بواجهة رخامية.',en:'A marble-fronted reception desk.'}},
    {id:'s7',file:'pano7.jpg',title:{ar:'معرض القطع الصحّية',en:'Sanitaryware gallery'},text:{ar:'تشكيلة واسعة من الوحدات الصحية والمغاسل.',en:'A wide range of sanitaryware and basins.'}},
    {id:'s8',file:'pano8.jpg',title:{ar:'أحواض الاستحمام',en:'Baths & bathroom sets'},text:{ar:'مساحات حمّام كاملة بتشطيبات متنوعة.',en:'Complete bathroom settings in mixed finishes.'}}
  ];
  var AUDIO = {ar:'/audio/tour/ar.mp3',en:'/audio/tour/en.mp3'};
  var N = ORDER.length;

  var params = new URLSearchParams(location.search);
  var stored = null;
  try { var raw = localStorage.getItem('assadaka.lang'); if (raw) stored = JSON.parse(raw); } catch (e) {}
  var lang = params.get('lang');
  if (lang !== 'ar' && lang !== 'en') lang = (stored === 'ar' || stored === 'en') ? stored : 'ar';
  var L = I18N[lang];
  var rtl = lang === 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.title = L.pageTitle;

  var caption = document.getElementById('caption');
  var statusBox = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var soundBtn = document.getElementById('btn-sound');
  var audio = document.getElementById('narration');
  var thumbs = document.getElementById('thumbs');

  function setStatus(msg, on) {
    statusText.textContent = msg;
    statusBox.classList.toggle('is-on', !!on);
  }
  function post(type, extra) {
    if (window.parent === window) return;
    var m = Object.assign({source:'assadaka-viewer',type:type}, extra || {});
    try { window.parent.postMessage(m, '*'); } catch (e) {}
  }
  function idx(id) {
    for (var i = 0; i < N; i++) if (ORDER[i].id === id) return i;
    return -1;
  }

  /* Textes statiques de l'interface. */
  document.getElementById('v-title').textContent = L.bar;
  document.getElementById('btn-guided').textContent = L.guided;
  document.getElementById('btn-pause').title = L.pause;
  document.getElementById('btn-fs').title = L.fs;
  document.getElementById('btn-lang').textContent = L.switchLang;
  caption.textContent = L.loading;
  setStatus(L.audioHint, false);

  var arrowL = document.getElementById('arrow-l');
  var arrowR = document.getElementById('arrow-r');
  /* En RTL, « suivant » se trouve à gauche et pointe vers la gauche. */
  arrowL.onclick = function () { go(rtl ? 1 : -1); };
  arrowR.onclick = function () { go(rtl ? -1 : 1); };

  /* Pannellum : les hotspots et les titres de scène sont dans la langue choisie. */
  var scenes = {};
  ORDER.forEach(function (s, i) {
    scenes[s.id] = {
      title: s.title[lang], type:'equirectangular', panorama:s.file,
      haov:360, vaov:59.17, vOffset:0,
      hfov:90, minHfov:60, maxHfov:100,
      minPitch:-18, maxPitch:18,
      autoLoad:true, autoRotate:-1.2,
      hotSpots:[
        {pitch:-5,yaw:30,type:'scene',text:L.next,sceneId:ORDER[(i+1)%N].id},
        {pitch:-5,yaw:-150,type:'scene',text:L.prev,sceneId:ORDER[(i-1+N)%N].id}
      ]
    };
  });

  var firstId = params.get('scene');
  if (!scenes[firstId]) firstId = 's1';
  var cur = idx(firstId);
  if (cur < 0) cur = 0;

  var viewer;
  var viewerMissing = false;
  try {
    if (typeof pannellum === 'undefined') throw new Error('pannellum missing');
    viewer = pannellum.viewer('panorama', {
      default:{firstScene:firstId,sceneFadeDuration:1000}, scenes:scenes
    });
  } catch (e) {
    /* Le CDN peut être indisponible : l'audio, les légendes et la navigation
       restent utilisables grâce à ce viewer neutre. */
    viewerMissing = true;
    viewer = {loadScene:function(){},toggleFullscreen:function(){},on:function(){}};
  }

  /* ── état du commentaire audio ────────────────────────────────────── */
  var guided = false;
  var narrationOn = false;
  var ttsMode = false;
  var duration = 0;
  /* Stay just inside a segment: an exact boundary can round down in floating
     point and rewind the guided tour one stop at a time. */
  var SEEK_EPSILON = 0.2;
  var timer = null;
  window.__narrationOn = false;
  audio.src = AUDIO[lang];
  audio.loop = false;

  function clearTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function pauseAudio() {
    try { audio.pause(); } catch (e) {}
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
  }
  function postState() { post('NARRATION_STATE', {on:narrationOn, guided:guided, tts:ttsMode}); }
  function updateSoundUI() {
    window.__narrationOn = narrationOn;
    soundBtn.textContent = narrationOn ? L.soundOff : L.soundOn;
    soundBtn.setAttribute('aria-pressed', narrationOn ? 'true' : 'false');
    soundBtn.classList.toggle('is-on', narrationOn);
    setStatus(narrationOn ? L.playing : (viewerMissing ? L.viewerMissing : L.audioHint), narrationOn);
  }
  function seekTo(i) {
    if (!duration) return;
    try { audio.currentTime = Math.max(0, Math.min(duration - 0.15, i * duration / N + SEEK_EPSILON)); } catch (e) {}
  }
  function refresh() {
    var s = ORDER[cur];
    caption.textContent = s.title[lang] + ' — ' + s.text[lang];
    var imgs = thumbs.querySelectorAll('img');
    for (var k = 0; k < imgs.length; k++) imgs[k].classList.toggle('active', imgs[k].dataset.id === s.id);
    post('SCENE_CHANGE', {index:cur, sceneId:s.id});
  }
  function loadSceneId(id) {
    var i = idx(id);
    if (i < 0) return;
    cur = i;
    refresh();
    try { viewer.loadScene(id); } catch (e) {}
    if (narrationOn && !ttsMode && duration) seekTo(i);
  }

  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      var want = lang === 'ar' ? 'ar' : 'en';
      var exact = lang === 'ar' ? 'ar-sa' : 'en-gb';
      for (var i = 0; i < vs.length; i++) if (vs[i].lang.toLowerCase() === exact) return vs[i];
      for (var j = 0; j < vs.length; j++) if (vs[j].lang.toLowerCase().indexOf(want) === 0) return vs[j];
    } catch (e) {}
    return null;
  }
  /* Repli : voix du navigateur si le MP3 manque ou si la lecture est bloquée. */
  function speakCurrent() {
    if (!narrationOn || !guided || !ttsMode || !('speechSynthesis' in window)) return;
    var s = ORDER[cur];
    var u = new SpeechSynthesisUtterance(s.title[lang] + '. ' + s.text[lang]);
    u.lang = lang === 'ar' ? 'ar-SA' : 'en-GB';
    u.rate = 0.95;
    var v = pickVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!narrationOn || !guided || !ttsMode) return;
      loadSceneId(ORDER[(cur + 1) % N].id);
      speakCurrent();
    };
    u.onerror = function () { stopGuided(); setStatus(L.blocked, false); };
    try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
    catch (e) { stopGuided(); setStatus(L.blocked, false); }
  }
  function useTTS() {
    if (ttsMode) return;
    ttsMode = true;
    clearTimer();
    if (!('speechSynthesis' in window)) { setStatus(L.unsupported, false); stopGuided(); return; }
    setStatus(L.browserVoice, true);
    speakCurrent();
  }

  function setNarration(on) {
    narrationOn = !!on;
    ttsMode = false;
    clearTimer();
    if (narrationOn) {
      guided = true;              /* la piste audio pilote la visite */
      audio.loop = true;
      updateSoundUI(); postState();
      if (duration) seekTo(cur);
      try {
        var p = audio.play();
        if (p && typeof p.catch === 'function') p.catch(function () { useTTS(); });
      } catch (e) { useTTS(); }
    } else {
      pauseAudio();
      audio.loop = false;
      updateSoundUI(); postState();
      if (guided) timer = setInterval(function () { loadSceneId(ORDER[(cur + 1) % N].id); }, 9000);
    }
  }

  function startGuided(withNarration) {
    clearTimer();
    guided = true;
    cur = 0;
    refresh();
    try { viewer.loadScene(ORDER[0].id); } catch (e) {}
    setNarration(withNarration !== false);
  }
  function stopGuided() {
    guided = false;
    narrationOn = false;
    ttsMode = false;
    clearTimer();
    pauseAudio();
    audio.loop = false;
    updateSoundUI();
    postState();
  }
  function gotoScene(i) {
    stopGuided();
    loadSceneId(ORDER[((i % N) + N) % N].id);
  }
  function go(d) { gotoScene(cur + d); }

  function requestLang(next) {
    if (next !== 'ar' && next !== 'en') return;
    if (window.parent !== window) { post('REQUEST_LANG', {lang:next}); return; }
    var p = new URLSearchParams(location.search);
    p.set('lang', next);
    p.set('scene', ORDER[cur].id);
    if (narrationOn) p.set('narration', '1');
    location.search = p.toString();
  }

  audio.addEventListener('loadedmetadata', function () {
    duration = isFinite(audio.duration) ? audio.duration : 0;
    if (narrationOn && !ttsMode) seekTo(cur);
  });
  audio.addEventListener('timeupdate', function () {
    if (!narrationOn || ttsMode || !duration || !guided) return;
    var i = Math.max(0, Math.min(N - 1, Math.floor((audio.currentTime + SEEK_EPSILON) / (duration / N))));
    if (i !== cur) { cur = i; refresh(); try { viewer.loadScene(ORDER[i].id); } catch (e) {} }
  });
  audio.addEventListener('error', function () { if (narrationOn) useTTS(); });
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.getVoices(); } catch (e) {}
  }
  try {
    viewer.on('scenechange', function (id) {
      var i = idx(id);
      if (i < 0 || i === cur) return;
      /* Hotspot ou flèche Pannellum : on suit la scène et on recale l'audio. */
      cur = i;
      refresh();
      if (narrationOn && !ttsMode) seekTo(i);
      else if (narrationOn && ttsMode) speakCurrent();
    });
  } catch (e) {}

  /* Miniatures dans la langue du site. */
  ORDER.forEach(function (s, i) {
    var im = document.createElement('img');
    im.src = s.file;
    im.dataset.id = s.id;
    im.alt = s.title[lang];
    im.title = (i + 1) + '. ' + s.title[lang];
    im.onclick = function () { gotoScene(i); };
    thumbs.appendChild(im);
  });
  updateSoundUI();
  refresh();

  /* Protocole avec la page /visite. */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || d.source !== 'assadaka-visite') return;
    if (d.type === 'START_GUIDED') startGuided(d.narration !== false);
    else if (d.type === 'STOP_GUIDED') stopGuided();
    else if (d.type === 'GOTO_SCENE') {
      var i = Number.isInteger(d.index) ? d.index : idx(d.sceneId);
      if (i >= 0) gotoScene(i);
    }
    else if (d.type === 'SET_NARRATION') setNarration(!!d.on);
    else if (d.type === 'TOGGLE_NARRATION') setNarration(!narrationOn);
    else if (d.type === 'FULLSCREEN') { try { viewer.toggleFullscreen(); } catch (err) {} }
    else if (d.type === 'SET_LANG') requestLang(d.lang);
  });

  /* Globales utilisées par /visite (même origine). */
  window.viewer = viewer;
  window.ORDER = ORDER;
  window.go = go;
  window.gotoScene = gotoScene;
  window.startGuided = startGuided;
  window.stopGuided = stopGuided;
  window.setNarration = setNarration;
  window.requestLang = requestLang;

  /* Reprise automatique après un changement de langue ou un lancement différé. */
  var autoNarration = params.get('narration') === '1';
  var autoGuided = params.get('guided') === '1';
  if (autoNarration || autoGuided) {
    window.setTimeout(function () {
      if (autoGuided) startGuided(autoNarration);
      else { guided = true; setNarration(true); }
    }, 350);
  }
  post('READY', {lang:lang, scene:ORDER[cur].id});
})();
</script>
</body>
</html>
