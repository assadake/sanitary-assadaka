services:
  - type: web
    name: tolin-shop
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run typecheck && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
